<!DOCTYPE html>
<html lang="zh-CN" data-studio-scale="off">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>无限智能画布</title>
    <script>
        (function(){
            document.documentElement.classList.add('studio-theme-dark', 'theme-dark');
        })();
    </script>
    <script src="/static/vendor/js/lucide.js?v=2026.07.15.1786174994"></script>
    <script src="/static/js/theme.js?v=2026.07.15.1786174994"></script>
    <script src="/static/js/touch-mouse.js?v=2026.07.15.1786174994"></script>
    <script src="/static/js/i18n.js?v=2026.07.15.1786872950"></script>
<link rel="stylesheet" href="/static/css/variables.css?v=2026.07.15.1787984550">
<link rel="stylesheet" href="/static/css/canvas-list.css?v=2026.07.15.1787637327">
<link rel="stylesheet" href="/static/css/theme.css?v=2026.07.15.1787312284">
<link rel="stylesheet" href="/static/css/button-glass.css?v=2026.07.15.1787984550">
</head>
<body>
    <div id="workspace" class="workspace">
        <!-- LEFT: project sidebar -->
        <aside id="sidebar" class="ws-sidebar">
            <div class="ws-side-head">
                <div class="ws-side-title">项目</div>
                <div class="ws-side-actions" aria-label="项目工具">
                    <a id="canvasSettingsLink" class="ws-icon-btn ws-side-settings" data-av-interaction="top" href="/static/canvas-list.html?v=2026.07.15.1788318364" title="设置" aria-label="设置"><i data-lucide="settings" class="w-4 h-4"></i></a>
                    <button id="newProjectBtn" class="ws-side-add" type="button" data-av-interaction="top" title="新建项目" aria-label="新建项目">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
            <div id="newProjectRow" class="ws-newproj-row">
                <input id="newProjectInput" class="ws-newproj-input" type="text" maxlength="60" placeholder="项目名称">
                <button id="newProjectConfirm" class="ws-mini-btn primary" type="button" title="确定" aria-label="确定"><i data-lucide="check" class="w-3.5 h-3.5"></i></button>
                <button id="newProjectCancel" class="ws-mini-btn" type="button" title="取消" aria-label="取消"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
            </div>
            <div id="projectList" class="ws-project-list"></div>
            <div class="ws-side-foot">
                <button id="trashEntry" class="ws-trash-entry" type="button" data-av-interaction="top">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                    <span class="ws-trash-label">回收站</span>
                    <span id="trashBadge" class="ws-trash-badge">0</span>
                </button>
            </div>
        </aside>

        <!-- RIGHT: board -->
        <main class="ws-main">
            <div class="ws-home-tools" aria-label="画布主页工具">
                <div class="ws-home-context">
                    <strong id="homeProjectName" class="ws-home-project-name">项目</strong>
                    <span id="homeCanvasCount" class="ws-home-canvas-count">0 个画布</span>
                </div>
                <div class="ws-home-actions">
                    <label class="ws-home-search" for="canvasSearchInput" hidden>
                        <i data-lucide="search" class="w-4 h-4"></i>
                        <input id="canvasSearchInput" type="search" placeholder="搜索画布…" autocomplete="off">
                    </label>
                    <div class="ws-home-sort-wrap" id="canvasSortControl" hidden>
                        <i data-lucide="arrow-up-down" class="w-4 h-4" aria-hidden="true"></i>
                        <button id="canvasSortButton" class="ws-home-sort-button" type="button" aria-label="画布排序" aria-haspopup="listbox" aria-expanded="false">
                            <span id="canvasSortButtonLabel">手动排序</span>
                            <i data-lucide="chevron-down" class="ws-home-sort-chevron" aria-hidden="true"></i>
                        </button>
                        <select id="canvasSortSelect" aria-label="画布排序" hidden>
                            <option value="manual">手动排序</option>
                            <option value="updated">最近修改</option>
                            <option value="name">名称</option>
                            <option value="nodes">节点数量</option>
                        </select>
                        <div id="canvasSortMenu" class="ws-home-sort-menu" role="listbox" aria-label="画布排序选项" hidden>
                            <div class="ws-home-sort-menu-title">排序方式</div>
                            <div class="ws-home-sort-option active" role="option" tabindex="0" data-sort-value="manual" aria-selected="true"><span>手动排序</span><i data-lucide="check" aria-hidden="true"></i></div>
                            <div class="ws-home-sort-option" role="option" tabindex="-1" data-sort-value="updated" aria-selected="false"><span>最近修改</span><i data-lucide="check" aria-hidden="true"></i></div>
                            <div class="ws-home-sort-option" role="option" tabindex="-1" data-sort-value="name" aria-selected="false"><span>名称</span><i data-lucide="check" aria-hidden="true"></i></div>
                            <div class="ws-home-sort-option" role="option" tabindex="-1" data-sort-value="nodes" aria-selected="false"><span>节点数量</span><i data-lucide="check" aria-hidden="true"></i></div>
                        </div>
                    </div>
                    <button id="homeNewCanvasBtn" class="ws-home-primary" type="button" data-av-interaction="top"><i data-lucide="plus" class="w-4 h-4"></i><span>新建画布</span></button>
                    <button id="homeImportCanvasBtn" class="ws-home-secondary" type="button" data-av-interaction="top"><i data-lucide="archive" class="w-4 h-4"></i><span>导入</span></button>
                    <button id="pasteCanvasBtn" class="ws-paste-btn" type="button" data-av-interaction="top" title="粘贴到此项目" style="display:none"><i data-lucide="clipboard-paste" class="w-4 h-4"></i><span>粘贴到此项目</span></button>
                </div>
            </div>

            <div id="board" class="ws-board launcher-board">
                <div id="boardWorld" class="ws-board-world launcher-world"></div>
            </div>
            <input id="canvasImportInput" type="file" accept=".zip,application/zip" hidden>

            <!-- Trash panel (overlay over the board area) -->
            <div id="trashPanel" class="ws-trash-panel">
                <div class="ws-trash-head">
                    <div class="ws-trash-head-title"><i data-lucide="trash-2" class="w-4 h-4"></i><span>回收站</span></div>
                    <button id="trashClose" class="ws-icon-btn" type="button" title="关闭" aria-label="关闭"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>
                <div class="ws-trash-note"><i data-lucide="info" class="w-3.5 h-3.5"></i><span>回收站中的画布会在 30 天后自动清理。</span></div>
                <div id="trashList" class="ws-trash-list"></div>
            </div>

            <div id="boardStatus" class="ws-status"></div>
        </main>

        <div id="canvasListApiSettingsModal" class="api-settings-modal" hidden>
            <section class="api-settings-modal-card" role="dialog" aria-modal="true" aria-labelledby="canvasListApiSettingsTitle">
                <header class="api-settings-modal-head">
                    <div class="api-settings-modal-title"><i data-lucide="key-round"></i><span id="canvasListApiSettingsTitle">API 设置</span></div>
                    <div class="api-settings-modal-actions"><span id="canvasListApiSettingsStatus" class="api-settings-modal-status" role="status" aria-live="polite"></span><button id="canvasListApiSettingsClose" class="api-settings-modal-close" type="button" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div>
                </header>
                <iframe id="canvasListApiSettingsFrame" class="api-settings-modal-frame" title="API 设置"></iframe>
            </section>
        </div>
    </div>
    <script src="/static/js/glass-interaction.js?v=2026.07.15.1786174994"></script>
<script src="/static/js/modules/ui-utils.js?v=2026.07.15.1786891976"></script>
<script src="/static/js/zip-utils.js?v=2026.07.15.1787367925"></script>
<script src="/static/js/canvas-list-view.js?v=2026.07.15.1787623952"></script>
<script src="/static/js/canvas-list.js?v=2026.07.15.1787624605"></script>
</body>
</html>
